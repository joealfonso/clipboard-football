[project]
name = "clipboard-football-pipeline"
version = "0.1.0"
description = "Rebuilds shipped data files from nflverse. Step 1: inventory survey into docs/DATA.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "nflreadpy==0.1.5",
    "polars==2.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The package is the pipeline/ directory itself, imported as `pipeline` from the repo root.
pythonpath = [".."]
testpaths = ["tests"]
